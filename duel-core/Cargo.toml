[package]
name = "duel-core"
version = "0.1.0"
edition = "2021"
description = "Spender Duel search core (engine + determinized MCTS + heuristic leaf), ported from games/spender_duel for max sims/s. Compiles native (dev/test/offline) and WASM (in-browser serving)."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# The clock: std::time::Instant panics on wasm32-unknown-unknown (see src/clock.rs).
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Native-only cross-impl bridge (parity fixtures + the move server). Keeps serde out
# of the native lib otherwise.
bridge = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "parity"
required-features = ["bridge"]

[[bin]]
name = "ai_parity"
required-features = ["bridge"]

[[bin]]
name = "move_server"
required-features = ["bridge"]

[[bin]]
name = "compact_parity"
required-features = ["bridge"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
