[package]
name = "duel-core"
version = "0.1.0"
edition = "2021"
description = "Spender Duel search core (engine + determinized MCTS + heuristic leaf), ported from games/spender_duel for max sims/s. Compiles native (dev/test/offline) and WASM (in-browser serving)."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# The clock: std::time::Instant panics on wasm32-unknown-unknown (see src/clock.rs).
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Native-only cross-impl bridge (parity fixtures + the move server). Keeps serde out
# of the native lib otherwise.
bridge = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "parity"
required-features = ["bridge"]

[[bin]]
name = "ai_parity"
required-features = ["bridge"]

[[bin]]
name = "move_server"
required-features = ["bridge"]

[[bin]]
name = "compact_parity"
required-features = ["bridge"]

# Self-play harvest for the learned value net (Phase 1). Gated behind `bridge` to keep it
# out of the default/wasm build, like the other native-only offline tools.
[[bin]]
name = "harvest_value"
required-features = ["bridge"]

# Self-play harvest for the learned POLICY+value net (Phase 3): features + softmax-over-Q policy
# target over the 320-action space (`actions.rs`) + outcome. Native-only, like the other tools.
[[bin]]
name = "harvest_pv"
required-features = ["bridge"]

# Leaf-cost profiler (heuristic vs encoder vs MLP) — decides whether int8+SIMD is the
# right lever for the net-leaf wall-clock handicap.
[[bin]]
name = "bench_leaf"
required-features = ["bridge"]

# EXACT endgame-search diagnostic (Part B): how often does the exact minimax find a forced
# win/block that the sampled MCTS misses? Native-only, like the other offline tools.
[[bin]]
name = "endgame_diag"
required-features = ["bridge"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
