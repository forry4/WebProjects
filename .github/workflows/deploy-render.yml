name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'app.py'   # composition root — creates the FastAPI app + mounts the features
      - 'core/**/*.py'   # shared DB + auth layer imported by main + coc + books
      - 'games/spender/main.py'
      - 'books/**'
      - 'games/spender/requirements.txt'
      - 'games/spender/app.py'
      - 'games/spender/Dockerfile'
      - 'games/spender/ai/az_model.npz'
      - 'games/spender/ai/az/**/*.py'   # serving imports: heuristic, valuation, engine, actions, mcts, infer_np
      - 'games/spender/ai/weights*.json'   # variants A/B/C/C2 — loaded at import (main.load_weights)
      - 'games/spender/ai/value_model.json'   # value-leaf model — loaded at import (main.load_value_model)
      - 'games/spender/puzzle/**/*.py'   # puzzle-mode serve code
      - 'games/spender/puzzle/puzzles/*.json'   # the puzzle bank — served as static content by serve.py
      - 'games/castles_of_crimson/**/*.py'
      - 'games/wherewolf/**/*.py'
      - 'games/spender_duel/**/*.py'
  workflow_dispatch:

jobs:
  # Gate the deploy on the test suite: previously the Render hook fired on push with no
  # test dependency, so a red suite still deployed. `deploy` now `needs: test`, so the
  # hook only fires when tests pass on this push.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r games/spender/requirements.txt
      - name: Run tests
        run: |
          python -m pytest core/tests/ games/spender/tests/ books/tests/ games/castles_of_crimson/tests/ games/wherewolf/tests/ games/spender_duel/tests/ wwsd/tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Render response: $response"
          [ "$response" = "200" ] || [ "$response" = "202" ] || { echo "Deploy hook failed with status $response"; exit 1; }
