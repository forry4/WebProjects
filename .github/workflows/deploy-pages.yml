name: Deploy to GitHub Pages

# Builds the Vite app and publishes it DIRECTLY via the official GitHub Pages
# deployment action (Pages source = "GitHub Actions" / build_type=workflow).
#
# This deliberately does NOT push to a `gh-pages` branch. The old branch-based
# ("legacy") flow force-pushed dist/ to gh-pages, which then triggered a SEPARATE,
# GitHub-managed "pages build and deployment" run whose Deploy step is outside our
# control and flaked repeatedly (failing to publish while the build succeeded, so the
# live site silently served a stale bundle; `rerun-failed-jobs` on it was unreliable).
# The Actions-based flow is a single run we own: if the deploy step ever flakes, just
# re-run THIS workflow's `deploy` job and it retries the same official deploy path.
#
# Rollback to the legacy flow: flip Settings -> Pages -> Source back to
# `gh-pages` / root (build_type=legacy) and restore the git-history version of this
# file. The `gh-pages` branch is left intact as that safety net.
on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'games/spender/**'
      - 'games/castles_of_crimson/**'
      - 'games/wherewolf/**'
      - 'books/**'
      - 'shared/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:   # manual "Run workflow" button

# Grant the deploy job the OIDC + Pages permissions the official action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy; queue the next one instead so a rapid
# second push waits rather than aborting a publish half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: webapp
        run: npm install

      # Gate the deploy: build the app, load it in a headless browser, and fail if
      # the page is blank / throws (e.g. a stray backtick in the CSS template). This
      # runs BEFORE the real Build step so its throwaway build can't ship.
      - name: Install browser for smoke test
        working-directory: webapp
        run: npx playwright install --with-deps chromium

      - name: Smoke test (app must render, no blank page)
        working-directory: webapp
        run: npm run smoke

      - name: Build
        working-directory: webapp
        env:
          VITE_WS_URL: wss://splendid-nelz.onrender.com/ws
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # GitHub's Pages backend occasionally hard-fails the deploy step transiently
      # (build is fine; publish flakes). One automatic in-job retry self-heals it so a
      # transient flake never needs a manual re-run. Runs ONLY if the first attempt
      # failed; if this one also fails, re-run the `deploy` job by hand as the backstop.
      - name: Retry deploy once if it flaked
        if: failure() && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
