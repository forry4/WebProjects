name: Deploy to GitHub Pages

# Builds the Vite app and publishes it DIRECTLY via the official GitHub Pages
# deployment action (Pages source = "GitHub Actions" / build_type=workflow).
#
# This deliberately does NOT push to a `gh-pages` branch. The old branch-based
# ("legacy") flow force-pushed dist/ to gh-pages, which then triggered a SEPARATE,
# GitHub-managed "pages build and deployment" run whose Deploy step is outside our
# control and flaked repeatedly (failing to publish while the build succeeded, so the
# live site silently served a stale bundle; `rerun-failed-jobs` on it was unreliable).
# The Actions-based flow is a single run we own: if the deploy step ever flakes, just
# re-run THIS workflow's `deploy` job and it retries the same official deploy path.
#
# Rollback to the legacy flow: flip Settings -> Pages -> Source back to
# `gh-pages` / root (build_type=legacy) and restore the git-history version of this
# file. The `gh-pages` branch is left intact as that safety net.
on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'games/spender/**'
      - 'games/castles_of_crimson/**'
      - 'games/wherewolf/**'
      - 'games/spender_duel/**'
      - 'games/dontminion/**'
      - 'games/dissonance/**'
      - 'books/**'
      - 'shared/**'
      - '.github/workflows/deploy-pages.yml'
      # Docs never reach the bundle — nothing in the build imports markdown, and the
      # per-package CLAUDE.md files live INSIDE the globs above, so without this every
      # docs edit rebuilt and republished a byte-identical site. Must be a trailing
      # negative pattern rather than `paths-ignore`: GitHub rejects both filters on one
      # event, and later patterns override earlier ones.
      - '!**/*.md'
      # Python test packages don't reach the bundle either, and they live inside the
      # same globs — so a test-only commit republished a byte-identical site. Not
      # merely wasted minutes: the build stamps a fresh `__BUILD_ID__` + version.json,
      # and shared/update-nudge.js reads that on tab-focus, so every open tab was
      # prompted to Refresh for a change no browser can observe.
      # This does NOT match `webapp/test/` (singular) on purpose — smoke.mjs and
      # screens.mjs ARE the frontend gates, and editing a gate must re-run it.
      - '!**/tests/**'
  workflow_dispatch:   # manual "Run workflow" button

# Grant the deploy job the OIDC + Pages permissions the official action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy; queue the next one instead so a rapid
# second push waits rather than aborting a publish half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: webapp
        run: npm install

      # Gate the deploy: build the app, load it in a headless browser, and fail if
      # the page is blank / throws (e.g. a stray backtick in the CSS template). This
      # runs BEFORE the real Build step so its throwaway build can't ship.
      - name: Install browser for smoke test
        working-directory: webapp
        run: npx playwright install --with-deps chromium

      - name: Smoke test (app must render, no blank page)
        working-directory: webapp
        run: npm run smoke

      # The REAL render gate. `smoke` never leaves the loading screen (the shell pings
      # the backend before it routes, and smoke has no backend), so it has never once
      # rendered a game — a mount-time crash in any game passes smoke green. This boots
      # the actual backend and asserts each game screen mounts its own markup.
      # Verified by injecting a runtime throw into WhereWolf: smoke PASSED, this FAILED.
      - name: Set up Python (for the screens gate's backend)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r games/spender/requirements.txt

      - name: Game-screen render gate (real backend)
        working-directory: webapp
        run: npm run screens

      - name: Build
        working-directory: webapp
        env:
          VITE_WS_URL: wss://splendid-nelz.onrender.com/ws
          # Stamps the bundle AND the emitted version.json with this commit, so a
          # tab still running an older build can notice and offer a refresh
          # (shared/update-nudge.js). Absent locally -> 'dev' -> nudge disabled.
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

      # SPA deep-link fallback: GitHub Pages has no rewrite rules, so an unknown path
      # (/duel, /spender/ABCD12) serves 404.html — make that a copy of the built app
      # (AFTER build, so it carries the same hashed asset tags). Pages returns it with
      # HTTP status 404, which browsers render fine (known crawler caveat, accepted).
      # The Cloudflare staging worker doesn't need this (single-page-application mode).
      - name: SPA deep-link fallback (404.html)
        working-directory: webapp
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub's Pages backend occasionally hard-fails the deploy step transiently
      # (build is fine; publish flakes). continue-on-error lets the job proceed to the
      # retry instead of failing here, so a recovered flake reports SUCCESS (not a red
      # run that looks identical to a real failure). If BOTH attempts fail the retry
      # step — which has no continue-on-error — fails the job as the true signal.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # One automatic in-job retry self-heals a transient flake — no manual re-run needed.
      - name: Retry deploy once if it flaked
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
