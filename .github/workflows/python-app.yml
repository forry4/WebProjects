name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r games/spender/requirements.txt
      - name: Run tests
        # Bare pytest — the suite is defined by `testpaths` in pytest.ini. This
        # list used to omit games/spender_duel/tests/ (present in the Render
        # deploy gate), so Duel's tests never ran on a push or PR.
        run: python -m pytest -q
