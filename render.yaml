services:
  - type: web
    name: spender-backend
    env: docker
    plan: free
    branch: main
    dockerfilePath: games/spender/Dockerfile
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

# wwsd-backend (the "What Would Steve Do" Splendor advisor for a friend's external site) used to
# be a 2nd free Render web service defined here. DECOMMISSIONED 2026-07-08: WWSD now runs entirely
# in the friend's browser via the Rust->WASM Tampermonkey userscript (wwsd/wwsd_browser_n.user.js),
# which makes NO backend calls, so the Render service served nothing (it only ever cold-started on
# demand). The wwsd/ Python package (app.py + analyze.py) stays in the repo as reference. To
# restore: re-add a `- type: web` block running `uvicorn wwsd.app:app ...` with the
# WWSD_SECRET/WWSD_ORIGIN/WWSD_TIME env vars, and recreate the service in the Render dashboard.
